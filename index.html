<title>IMC Maintenance Requests</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sticky brand bar + tabs; form and live WhatsApp preview side by side on desktop, stacked on phone */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eef3f9; --line:#d9e2ee;
  --fg:#14233a; --muted:#5d6b80;
  --accent:#1d4f91; --accent-ink:#ffffff; --accent-soft:#e3ecf8;
  --ok:#1b7f4b; --ok-soft:#e2f4ea; --urgent:#b4232c; --urgent-soft:#fbe5e6; --warn:#9a6200; --warn-soft:#fdf1d9;
  --bubble:#dcf8c6; --bubble-fg:#111b21; --chat:#e9e4dc;
  --font:"Bahij Janna","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1522; --surface:#142033; --surface-2:#1a2940; --line:#26384f;
  --fg:#e6edf6; --muted:#9aaac0;
  --accent:#6fa3e8; --accent-ink:#0b1626; --accent-soft:#1c3253;
  --ok:#55c98a; --ok-soft:#163626; --urgent:#ff7a80; --urgent-soft:#3d1a1e; --warn:#f0b54a; --warn-soft:#3a2c12;
  --bubble:#005c4b; --bubble-fg:#e9edef; --chat:#0b141a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1522; --surface:#142033; --surface-2:#1a2940; --line:#26384f;
  --fg:#e6edf6; --muted:#9aaac0;
  --accent:#6fa3e8; --accent-ink:#0b1626; --accent-soft:#1c3253;
  --ok:#55c98a; --ok-soft:#163626; --urgent:#ff7a80; --urgent-soft:#3d1a1e; --warn:#f0b54a; --warn-soft:#3a2c12;
  --bubble:#005c4b; --bubble-fg:#e9edef; --chat:#0b141a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center;border:1px solid var(--line)}
.logo img{height:40px;width:auto;display:block}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font-size:17px;font-weight:700;line-height:1.25;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.tools{display:flex;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:9px;height:36px;min-width:36px;padding:0 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tab .count{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:1px 7px;margin-inline-start:6px}
main{padding-block:20px 40px}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.sec{display:grid;gap:12px}
.sec+.sec{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}
.sec h2{margin:0;font-size:13px;letter-spacing:.04em;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:8px}
.sec h2 code{font-family:var(--mono);font-size:12px;background:var(--accent-soft);padding:1px 6px;border-radius:5px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.row,.row.three{grid-template-columns:minmax(0,1fr)}}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.num{font-family:var(--mono);direction:ltr;text-align:start}
[dir="rtl"] input.num{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:20px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);color:var(--fg);font:inherit;font-weight:600;padding:9px;cursor:pointer}
.seg button[aria-pressed="true"][data-v="Normal"]{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="Urgent"]{background:var(--urgent-soft);color:var(--urgent)}
.finder{position:relative}
.sugg{position:absolute;inset-inline:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(10,25,50,.18);max-height:260px;overflow:auto;z-index:4}
.sugg button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:none;color:var(--fg);font:inherit;padding:9px 12px;cursor:pointer;text-align:start}
.sugg button:hover,.sugg button.on{background:var(--accent-soft)}
.sugg small{font-family:var(--mono);color:var(--muted);direction:ltr}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.reqno{display:flex;align-items:center;gap:8px}
.reqno input{font-size:20px;font-weight:600;text-align:center}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.btn.ghost{background:none}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px)}
.chat{background:var(--chat);border-radius:var(--r);padding:16px;min-height:200px}
.bubble{background:var(--bubble);color:var(--bubble-fg);border-radius:10px 10px 2px 10px;padding:10px 12px;direction:ltr;text-align:left;white-space:pre-wrap;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.12);overflow-wrap:anywhere}
.bubble .t{display:block;text-align:right;font-size:11px;opacity:.6;margin-top:4px}
.pvhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.pvhead h2{margin:0;font-size:14px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:600;z-index:20;transition:opacity .2s}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input{flex:1;min-width:0}
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border-inline-start:4px solid var(--line)}
.item.Urgent{border-inline-start-color:var(--urgent)}
.item.Normal{border-inline-start-color:var(--ok)}
.item.done{opacity:.62}
.no{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--accent);min-width:48px;text-align:center}
.item h3{margin:0;font-size:15px;direction:ltr;text-align:start}
[dir="rtl"] .item h3{text-align:right}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.pill{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px}
.pill.Urgent{background:var(--urgent-soft);color:var(--urgent)}
.pill.Normal{background:var(--ok-soft);color:var(--ok)}
.pill.done{background:var(--surface-2);color:var(--muted)}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.itemact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.itemact button{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.itemact button.del{color:var(--urgent)}
@media (max-width:560px){.item{grid-template-columns:auto minmax(0,1fr)}.itemact{grid-column:1/-1;justify-content:flex-start}}
.empty{text-align:center;color:var(--muted);padding:30px;border:1px dashed var(--line);border-radius:var(--r)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font-size:12px;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
td .alt{color:var(--muted);font-size:12px}
.addemp{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-bottom:14px}
@media (max-width:600px){.addemp{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px}
.stat b{font-family:var(--mono);margin-inline-end:4px}
.confirm{display:flex;gap:6px;align-items:center;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

    <div class="brand">
      <h1 data-i="title">طلبات الصيانة</h1>
      <p data-i="sub">غرفة التحكم · قسم الأمن</p>
    </div>
    <div class="tools">
      <button class="iconbtn" id="langBtn" type="button">EN</button>

    <button class="tab" role="tab" aria-selected="false" data-tab="emp" id="tabEmp"><span data-i="tEmp">الموظفين</span><span class="count" id="empCount">0</span></button>
  </div>
</header>

<main class="wrap">
  <!-- NEW REQUEST -->
  <section id="view-new">
    <div class="grid">
      <form class="panel" id="form" autocomplete="off">
        <div class="sec">
          <h2><code>{Report}</code> <span data-i="report">البلاغ</span></h2>
          <label><span data-i="subject">الموضوع (Subject)</span>
            <input id="subject" placeholder="High humidity levels." required>
          </label>
          <div class="chips" id="subjectChips"></div>
          <div class="row">
            <label><span data-i="floor">الدور</span>
              <select id="floor"></select>
            </label>
            <label><span data-i="area">القسم / العيادة</span>
              <input id="area" list="areaList" placeholder="Dialysis Clinic">
              <datalist id="areaList"></datalist>
            </label>
          </div>
          <label><span data-i="status">الحالة (Status)</span>
            <div class="seg" id="statusSeg">
              <button type="button" data-v="Normal" aria-pressed="true" data-i="normal">عادي · Normal</button>
              <button type="button" data-v="Urgent" aria-pressed="false" data-i="urgent">عاجل · Urgent</button>
            </div>
          </label>
        </div>

        <div class="sec">
          <h2><code>{Reporter}</code> <span data-i="reporter">مقدم البلاغ</span></h2>
          <label class="finder"><span data-i="find">ابحث بالاسم أو الرقم الوظيفي أو التحويلة</span>
            <input id="finder" placeholder="مصطفى · 10803 · 4253">
            <div class="sugg" id="sugg" hidden></div>
          </label>
          <div class="row">
            <label><span data-i="name">الاسم (Name)</span><input id="name" required></label>
            <label><span data-i="dept">القسم (Department)</span><input id="dept" list="areaList"></label>
          </div>
          <div class="row three">
            <label><span data-i="empid">الرقم الوظيفي</span><input id="empid" class="num" inputmode="numeric"></label>
            <label><span data-i="ext">التحويلة</span><input id="ext" class="num" inputmode="numeric" list="extList"><datalist id="extList"></datalist></label>
            <label><span data-i="email">البريد (Email)</span><input id="email" class="num" type="email" placeholder="name@imc.med.sa"></label>
          </div>
        </div>

        <div class="sec">
          <h2 data-i="reqno">رقم الطلب</h2>
          <div class="reqno">
            <input id="reqno" class="num" inputmode="numeric" required>
            <span class="hint" data-i="reqhint">يزيد تلقائياً بعد كل حفظ</span>
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" type="submit" id="saveBtn" data-i="save">حفظ ونسخ</button>
          <a class="btn wa" id="waBtn" href="#" target="_blank" rel="noopener" data-i="wa">إرسال واتساب</a>
          <button class="btn ghost" type="button" id="clearBtn" data-i="clear">طلب جديد فارغ</button>
        </div>
      </form>

      <aside class="preview">
        <div class="panel">
          <div class="pvhead">
            <h2 data-i="preview">معاينة الرسالة</h2>
            <button class="btn" type="button" id="copyBtn" data-i="copy">نسخ</button>
          </div>
          <div class="chat"><div class="bubble" id="bubble"></div></div>
          <textarea id="raw" hidden readonly></textarea>
        </div>
      </aside>
    </div>
  </section>

  <!-- LOG -->
  <section id="view-log" hidden>
    <div class="toolbar">
      <input id="logSearch" placeholder="بحث في السجل…" data-ph="logSearch">
      <select id="logFilter" style="width:auto">
        <option value="all" data-i="fAll">الكل</option>
        <option value="open" data-i="fOpen">قيد التنفيذ</option>
        <option value="Urgent" data-i="fUrgent">عاجل</option>
        <option value="done" data-i="fDone">منجز</option>
      </select>
    </div>
    <div class="stats" id="stats" style="margin-bottom:14px"></div>
    <div class="list" id="logList"></div>
  </section>

  <!-- EMPLOYEES -->
  <section id="view-emp" hidden>
    <form class="addemp" id="empForm" autocomplete="off">
      <input id="eName" placeholder="الاسم" data-ph="pName" required>
      <input id="eId" class="num" placeholder="الرقم الوظيفي" data-ph="pId" inputmode="numeric" required>
      <input id="eExt" class="num" placeholder="التحويلة" data-ph="pExt" inputmode="numeric">
      <button class="btn primary" type="submit" data-i="addEmp">إضافة / تحديث</button>
    </form>
    <div class="toolbar"><input id="empSearch" placeholder="بحث عن موظف…" data-ph="empSearch"></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th data-i="name">الاسم</th><th data-i="empid">الرقم الوظيفي</th><th data-i="ext">التحويلة</th><th data-i="otherExt">تحويلات أخرى</th><th></th></tr></thead>
        <tbody id="empBody"></tbody>
      </table>
    </div>
  </section>
</main>

function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";

const $=id=>document.getElementById(id);

/* ---------- theme ---------- */

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.tab));

/* ---------- form setup ---------- */

$("statusSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{status=b.dataset.v;setStatus()});
function setStatus(){$("statusSeg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===status));update()}
const FIELDS=["subject","floor","area","name","dept","email","empid","ext","reqno"];
FIELDS.forEach(f=>$(f).addEventListener("input",update));

function data(){
  const d={};FIELDS.forEach(f=>d[f]=$(f).value.trim());d.status=status;return d;
}
function location_(d){return [d.floor,d.area].filter(Boolean).join(" – ")}
function message(d){
  return `*To the Esteemed Maintenance Department,*

*{Report}*

*Subject:* ${d.subject}

*Location:* ${location_(d)}.

*Status:* ${d.status}.

*{Reporter}*

*Name:* ${d.name}

*Department:* ${d.dept}

*Email:* ${d.email}

*Extension:* ${d.ext}

*Employee ID:* ${d.empid}

*Request Number:* ${d.reqno}

Best regards,
*Security Department*`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function waFormat(s){return esc(s).replace(/\*([^*\n]+)\*/g,"<b>$1</b>")}
function update(){
  const d=data(),m=message(d);
  $("raw").value=m;
  const now=new Date();
  $("bubble").innerHTML=waFormat(m)+`<span class="t">${now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</span>`;
  $("waBtn").href="https://wa.me/?text="+encodeURIComponent(m);
  try{S.set("draft",{...d})}catch(e){}
}
async function copy(text){
  try{await navigator.clipboard.writeText(text);return true}
  catch(e){const r=$("raw");r.hidden=false;r.value=text;r.select();try{document.execCommand("copy")}catch(_){}r.hidden=true;return true}
}
$("copyBtn").onclick=async()=>{await copy($("raw").value);toast(t("copied"))};

/* ---------- employee finder ---------- */
let hi=-1,matches=[];
const norm=s=>String(s||"").replace(/[إأآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").toLowerCase().trim();
function findEmps(q){
  q=norm(q);if(!q)return[];
  return emps.filter(e=>[e.name,...(e.alt||[])].some(n=>norm(n).includes(q))||e.id.includes(q)||(e.exts||[e.ext]).some(x=>String(x).includes(q))).slice(0,8);
}
$("finder").addEventListener("input",()=>{matches=findEmps($("finder").value);hi=matches.length?0:-1;drawSugg()});
$("finder").addEventListener("keydown",e=>{
  if($("sugg").hidden)return;
  if(e.key==="ArrowDown"){hi=Math.min(hi+1,matches.length-1);drawSugg();e.preventDefault()}
  else if(e.key==="ArrowUp"){hi=Math.max(hi-1,0);drawSugg();e.preventDefault()}
  else if(e.key==="Enter"&&hi>=0){pick(matches[hi]);e.preventDefault()}
  else if(e.key==="Escape"){$("sugg").hidden=true}
});
$("finder").addEventListener("blur",()=>setTimeout(()=>$("sugg").hidden=true,180));
function drawSugg(){
  const box=$("sugg");box.innerHTML="";
  if(!matches.length){box.hidden=true;return}
  matches.forEach((e,i)=>{const b=document.createElement("button");b.type="button";if(i===hi)b.className="on";
    b.innerHTML=`<span>${esc(e.name)}${e.alt&&e.alt.length?` <span class="hint">(${esc(e.alt.join("، "))})</span>`:""}</span><small>${esc(e.id)} · ${esc(e.ext||"—")}</small>`;
    b.onmousedown=ev=>{ev.preventDefault();pick(e)};box.appendChild(b)});
  box.hidden=false;
}
function pick(e){
  $("name").value=e.name;$("empid").value=e.id;$("ext").value=e.ext||"";
  if(e.dept)$("dept").value=e.dept;
  if(e.email)$("email").value=e.email;
  const dl=$("extList");dl.innerHTML="";(e.exts||[]).forEach(x=>{const o=document.createElement("option");o.value=x;dl.appendChild(o)});
  $("finder").value="";$("sugg").hidden=true;update();
}
// typing an employee ID directly also fills the rest
$("empid").addEventListener("change",()=>{const e=emps.find(x=>x.id===$("empid").value.trim());if(e&&!$("name").value)pick(e)});

/* ---------- save ---------- */
$("form").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const d=data();
  if(!d.subject||!d.name){toast(t("need"));return}
  if(log.some(r=>r.no===d.reqno)){toast(t("dup")(d.reqno));$("reqno").focus();return}
  const rec={no:d.reqno,subject:d.subject,floor:d.floor,area:d.area,status:d.status,name:d.name,dept:d.dept,email:d.email,empid:d.empid,ext:d.ext,ts:Date.now(),done:false};
  log.unshift(rec);S.set("log",log);
  // remember reporter details for next time
  if(d.empid){let e=emps.find(x=>x.id===d.empid);
    if(!e){e={id:d.empid,name:d.name,alt:[],ext:d.ext,exts:d.ext?[d.ext]:[]};emps.push(e)}
    if(d.ext){e.ext=d.ext;e.exts=e.exts||[];if(!e.exts.includes(d.ext))e.exts.push(d.ext)}
    if(d.dept)e.dept=d.dept; if(d.email)e.email=d.email; S.set("emps",emps)}
  await copy(message(d));
  nextNo=String((+d.reqno||0)+1);S.set("next",nextNo);
  toast(t("saved")(d.reqno));
  resetForm();renderLog();renderEmps();
});
function resetForm(){["subject","area","name","dept","email","empid","ext"].forEach(f=>$(f).value="");$("floor").value="Ground floor";status="Normal";$("reqno").value=nextNo;setStatus()}
$("clearBtn").onclick=resetForm;

/* ---------- log ---------- */
$("logSearch").oninput=renderLog;$("logFilter").onchange=renderLog;
const pending={};
function renderLog(){
  $("logCount").textContent=log.length;
  const q=norm($("logSearch").value),f=$("logFilter").value;
  const open=log.filter(r=>!r.done);
  $("stats").innerHTML=`<span class="stat"><b>${log.length}</b>${t("total")}</span><span class="stat"><b>${open.length}</b>${t("openC")}</span><span class="stat"><b>${open.filter(r=>r.status==="Urgent").length}</b>${t("urgentC")}</span>`;
  const rows=log.filter(r=>{
    if(f==="open"&&r.done)return false;if(f==="done"&&!r.done)return false;if(f==="Urgent"&&r.status!=="Urgent")return false;
    if(!q)return true;return norm([r.no,r.subject,r.floor,r.area,r.name,r.empid,r.ext,r.dept].join(" ")).includes(q)});
  const L=$("logList");L.innerHTML="";
  if(!rows.length){L.innerHTML=`<div class="empty">${t("emptyLog")}</div>`;return}
  rows.forEach(r=>{
    const el=document.createElement("div");el.className=`item ${r.status}${r.done?" done":""}`;
    const dt=new Date(r.ts).toLocaleString(lang==="ar"?"ar-SA-u-nu-latn-ca-gregory":"en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    el.innerHTML=`<div class="no">${esc(r.no)}</div>
      <div style="min-width:0"><h3>${esc(r.subject)}</h3>
        <div class="meta"><span>${esc(location_(r))}</span><span>${esc(r.name)} · ${esc(r.ext||"—")}</span><span>${dt}</span>
        <span class="pill ${r.status}">${r.status==="Urgent"?(lang==="ar"?"عاجل":"Urgent"):(lang==="ar"?"عادي":"Normal")}</span>
        <span class="pill ${r.done?"done":"open"}">${r.done?t("doneL"):t("openL")}</span></div></div>
      <div class="itemact"></div>`;
    const A=el.querySelector(".itemact");
    if(pending[r.no]){
      A.innerHTML=`<span class="confirm">${t("sure")}</span>`;
      A.appendChild(btn(t("yes"),()=>{log=log.filter(x=>x!==r);S.set("log",log);delete pending[r.no];renderLog()},"del"));
      A.appendChild(btn(t("no"),()=>{delete pending[r.no];renderLog()}));
    }else{
      A.appendChild(btn(t("cpy"),async()=>{await copy(message({...r,reqno:r.no}));toast(t("copied"))}));
      A.appendChild(btn(t("edit"),()=>loadIntoForm(r)));
      A.appendChild(btn(r.done?t("reopen"):t("markDone"),()=>{r.done=!r.done;S.set("log",log);renderLog()}));
      A.appendChild(btn(t("del"),()=>{pending[r.no]=1;renderLog()},"del"));
    }
    L.appendChild(el);
  });
}
function btn(txt,fn,cls){const b=document.createElement("button");b.type="button";b.textContent=txt;if(cls)b.className=cls;b.onclick=fn;return b}
function loadIntoForm(r){
  log=log.filter(x=>x!==r);S.set("log",log);
  ["subject","area","name","dept","email","empid","ext"].forEach(f=>$(f).value=r[f]||"");
  $("floor").value=r.floor||"Ground floor";$("reqno").value=r.no;status=r.status;setStatus();renderLog();show("new");
}

/* ---------- employees ---------- */
$("empSearch").oninput=renderEmps;
const empPending={};
function renderEmps(){
  $("empCount").textContent=emps.length;
  const q=$("empSearch").value;
  const list=q?findEmps(q).concat(emps.filter(e=>norm(e.dept||"").includes(norm(q)))).filter((v,i,a)=>a.indexOf(v)===i):emps.slice().sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  const B=$("empBody");B.innerHTML="";
  list.forEach(e=>{
    const tr=document.createElement("tr");
    const others=(e.exts||[]).filter(x=>x!==e.ext);
    tr.innerHTML=`<td>${esc(e.name)}${e.alt&&e.alt.length?`<div class="alt">${esc(e.alt.join("، "))}</div>`:""}</td><td class="n">${esc(e.id)}</td><td class="n">${esc(e.ext||"—")}</td><td class="n">${esc(others.join(" · ")||"")}</td><td></td>`;
    const c=tr.lastChild;c.style.display="flex";c.style.gap="6px";
    if(empPending[e.id]){
      c.appendChild(btn(t("yes"),()=>{emps=emps.filter(x=>x!==e);S.set("emps",emps);delete empPending[e.id];renderEmps();toast(t("empDel"))},"del"));
      c.appendChild(btn(t("no"),()=>{delete empPending[e.id];renderEmps()}));
    }else{
      c.appendChild(btn(t("use"),()=>{pick(e);show("new")}));
      c.appendChild(btn(t("del"),()=>{empPending[e.id]=1;renderEmps()},"del"));
    }
    c.querySelectorAll("button").forEach(b=>{b.className=(b.className+" chip").trim()});
    B.appendChild(tr);
  });
}
$("empForm").addEventListener("submit",ev=>{
  ev.preventDefault();
  const name=$("eName").value.trim(),id=$("eId").value.trim(),ext=$("eExt").value.trim();
  if(!name||!id)return;
  let e=emps.find(x=>x.id===id);
  if(e){if(e.name!==name&&!(e.alt||[]).includes(name))(e.alt=e.alt||[]).push(name)}
  else{e={id,name,alt:[],ext:"",exts:[]};emps.push(e)}
  if(ext){e.ext=ext;if(!e.exts.includes(ext))e.exts.push(ext)}
  S.set("emps",emps);["eName","eId","eExt"].forEach(f=>$(f).value="");renderEmps();toast(t("empSaved"));
});

/* ---------- toast ---------- */
let tt;function toast(m){const el=$("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2400)}

/* ---------- boot ---------- */
applyTheme();
const draft=S.get("draft",null);
if(draft&&(draft.subject||draft.name)){FIELDS.forEach(f=>{if(draft[f]!=null)$(f).value=draft[f]});status=draft.status||"Normal"}
else{ // example working state: the latest report, ready to resend
  $("subject").value="High humidity levels.";$("floor").value="Second Floor";$("area").value="Dialysis Clinic";
  $("name").value="Mustafa";$("empid").value="10803";$("ext").value="4253";status="Urgent";
}
if(!$("reqno").value)$("reqno").value=nextNo;
setStatus();applyLang();
</script>
